[package]
name = "nex"
version = "0.0.5"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
flamegraph = "0.6.15"
pretty-num = "0.1.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8+spec-1.1.0"
uid = "0.1.9"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
